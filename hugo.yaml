  about:
    enable: true
    title: "About Me"
    image: "/images/weiliang.jpg"
    content: |-
      Weiliang Will Zeng is with [Qualcomm AI Research](https://www.qualcomm.com/research/artificial-intelligence/ai-research), San Diego, CA, where he is now a Sr Staff System Engineer. He received his Ph.D. degree from the [Department of Electronic Engineering](http://www.ee.tsinghua.edu.cn/), [Tsinghua University](http://www.tsinghua.edu.cn), Beijing, China, in 2012 and his B.S. degree in electronic engineering from the [University of Electronic Science and Technology of China (UESTC)](http://www.uestc.edu.cn), Chengdu, China, in 2007, both with the highest honor. He was a Research Scholar (2009-2011) and a Post-Doctoral Fellow (2013-2014) at [Missouri University of Science and Technology](http://www.mst.edu) (formerly University of Missouri, Rolla, MO). His research interests include machine learning, optimization, wireless communications, information theory, signal processing, as well as for emerging technologies.

      He was the recipient of QualStar(s) from Qualcomm Incorporated, the scholarship award for Excellent Doctoral Student from Ministry of Education of China, Distinguished Honor Graduate from Beijing Municipal Commission of Education, and also the First-Class Scholarship for graduate students from Tsinghua University. He is a frequent author and reviewer for IEEE journals/conferences, TPC Co-chair for IEEE Globecom'17, and TPC member for various IEEE flagship conferences.

      At Qualcomm, Dr. Zeng works on aggressive research programs to enable the intelligent edge that serves billions of users using an unprecedented multidisciplinary approach coordinating novel technology developed in machine learning, information theory, signal processing, and wireless communications.
    skills:
      enable: true
      title: "Research Interests:"
      items:
        - "Machine Learning"
        - "Modeling, Analysis, Design & Optimization"
        - "Wireless Communications"
        - "Information Theory"
        - "Signal Processing"

