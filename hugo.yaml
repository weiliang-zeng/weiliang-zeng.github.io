  about:
    enable: true
    title: "About Me"
    image: "/images/weiliang.jpg"
    content: |-
      I'm with [Qualcomm AI Research](https://www.qualcomm.com/research/artificial-intelligence/ai-research), San Diego, CA, where I'm now a Sr Staff System Engineer/Manager. I received my Ph.D. degree from the [Department of Electronic Engineering](http://www.ee.tsinghua.edu.cn/), [Tsinghua University](http://www.tsinghua.edu.cn), Beijing, China, in 2012 and my B.S. degree in electronic engineering from the [University of Electronic Science and Technology of China (UESTC)](http://www.uestc.edu.cn), Chengdu, China, in 2007, both with the highest honor. I was a Research Scholar (2009-2011) and a Post-Doctoral Fellow (2013-2014) at [Missouri University of Science and Technology](http://www.mst.edu) (formerly University of Missouri, Rolla, MO).

      I was honored to receive the prestigious Qualcomm IP Achievement Award (AI domain) in 2025, multiple QualStar Awards from Qualcomm, the Excellent Doctoral Student Scholarship from the Ministry of Education of China, the Distinguished Honor Graduate award from the Beijing Municipal Commission of Education, and the First-Class Scholarship for graduate students from Tsinghua University. I’m a frequent author and reviewer for top-tier journals/conferences, TPC Co-chair for IEEE Globecom'17, and TPC member for various flagship conferences.

    skills:
      enable: true
      title: "Research Interests:"
      items:
        - "Generative AI (LLM/VLM/LVM)"
        - "Model Quantization"
        - "ML Compiler Optimization"
        - "Optimization Algorithms"
        - "Information Theory"
        - "Signal Processing"

