  projects:
    enable: true
    title: "Software"
    items:
      - title: "Approximation of Mutual Information (MI)"
        content: |-
          Calculating the MI for MIMO channels with finite-alphabet inputs can be difficult -- the embedded multiple integrals are hard to evaluate accurately, and Monte-Carlo estimation is slow. This code derives a lower bound with no integrals and low computational effort, approximating the MI (with a constant shift) across settings.

          Details in: W. Zeng, C. Xiao, and J. Lu, "A Low-Complexity Design of Linear Precoding for MIMO Channels with Finite-Alphabet Inputs," *IEEE Wireless Commun. Letters*, vol. 1, no. 1, pp. 38-41, Feb. 2012.
        image: /images/projects/mi-approximation.png
        badges:
          - "MATLAB"
          - "C++ (mex)"
        links:
          - icon: fa fa-download
            url: /download/Example_Fig1_Zeng2011WCL.zip
          - icon: fa fa-file-pdf
            url: https://dx.doi.org/10.1109/WCL.2012.121411.110025
          - icon: fa fa-quote-right
            url: /bibtex/zeng2012wcl.bib
          - icon: fa fa-envelope
            url: mailto:willie.zeng@gmail.com?subject=Bug%20report
      - title: "Approximation of Average Mutual Information (AMI)"
        content: |-
          Calculating the AMI under statistical CSI is even harder than MI, since it also averages over the fading channel. This code develops the lower bound and approximation for doubly-correlated MIMO channels.

          Details in: W. Zeng, C. Xiao, M. Wang, and J. Lu, "Linear Precoding for Finite-Alphabet Inputs Over MIMO Fading Channels With Statistical CSI," *IEEE Trans. Signal Process.*, vol. 60, no. 6, pp. 3134-3148, Jun. 2012.
        image: /images/projects/ami-approximation.png
        badges:
          - "MATLAB"
          - "C++ (mex)"
        links:
          - icon: fa fa-download
            url: /download/Example_Fig2_Zeng2012TSP.zip
          - icon: fa fa-file-pdf
            url: https://dx.doi.org/10.1109/TSP.2012.2188717
          - icon: fa fa-quote-right
            url: /bibtex/zeng2012tsp.bib
          - icon: fa fa-envelope
            url: mailto:willie.zeng@gmail.com?subject=Bug%20report

